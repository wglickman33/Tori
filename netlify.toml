[build]
  command = "npm run build"
  publish = "dist"

# Site URL: https://torihome.netlify.app
#
# Required Netlify env var (Site settings → Environment variables):
#   VITE_API_URL = https://YOUR-RENDER-SERVICE.onrender.com   (no trailing slash)
#
# Optional:
#   VITE_WHISK_URL = https://trywhisk.netlify.app
#   (defaults in code if unset)

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
