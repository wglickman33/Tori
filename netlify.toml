[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  VITE_WHISK_URL = "https://trywhisk.netlify.app"

# Site: https://torihome.netlify.app
#
# REQUIRED in Netlify UI → Environment variables (after Heroku API is live):
#   VITE_API_URL = https://YOUR-APP-NAME.herokuapp.com
#   (no trailing slash)

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
