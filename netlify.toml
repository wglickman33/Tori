[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  VITE_WHISK_URL = "https://trywhisk.netlify.app"

# Site: https://torihome.netlify.app
#
# REQUIRED in Netlify UI → Site configuration → Environment variables:
#   VITE_API_URL = https://<your-render-service>.onrender.com
#   (no trailing slash; set after Render is live, then trigger a redeploy)

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
